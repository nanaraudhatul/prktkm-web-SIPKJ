<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - SIPKJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/auth.css">
    <style>
        /* Tambahan style untuk error message dan toggle password */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-message::before {
            content: '⚠️';
        }
        
        /* Toggle Password Button */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #94a3b8;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .toggle-password:hover {
            color: #1e3a5f;
        }
        
        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
        
        .input-wrapper input {
            padding-right: 48px !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <!-- Logo SIPKJ PNG -->
        <div class="auth-logo">
            <div class="logo-wrapper">
                <img src="../../images/logo-sipkj.png" alt="SIPKJ Logo" class="logo-img"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;background:#1e3a5f;color:white;font-weight:800;font-size:14px;width:100%;height:100%;border-radius:8px;\'>SIPKJ</div>';">
            </div>
            <h1>Masuk ke Sistem</h1>
            <p>Sistem Pengaduan Kerusakan Jalan</p>
        </div>

        <div class="auth-divider"></div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Form -->
        <form id="loginForm">
            <div class="form-group">
                <label style="text-transform:none; letter-spacing:0; font-size:14px; font-weight:600;">Username atau Email</label>
                <div class="input-wrapper" style="position:relative;">
                    <span class="input-icon" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8; display:flex;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username atau email" required style="width:100%; padding:12px 16px 12px 44px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px;">
                </div>
            </div>

            <div class="form-group">
                <label style="text-transform:none; letter-spacing:0; font-size:14px; font-weight:600;">Kata Sandi</label>
                <div class="input-wrapper" style="position:relative;">
                    <span class="input-icon" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8; display:flex;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan kata sandi" required style="width:100%; padding:12px 16px 12px 44px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:14px;">
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)" title="Lihat kata sandi">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="checkbox-group" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:#64748b; cursor:pointer;">
                    <input type="checkbox" style="width:16px; height:16px; accent-color:#1e3a5f;">
                    Ingat saya
                </label>
                <a href="reset-password.html" style="color:#1e3a5f;font-weight:600;text-decoration:none;">Lupa Kata Sandi?</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn" style="width:100%; padding:14px; background:#1e3a5f; color:white; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s;">
                MASUK KE SISTEM
            </button>
        </form>

        <div class="auth-footer-link" style="text-align:center; margin-top:24px; font-size:14px; color:#64748b;">
            Belum punya akun? <a href="register.html" style="color:#1e3a5f; font-weight:700; text-decoration:none;">Daftar di sini
                <svg style="width:16px; height:16px; vertical-align:middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Tagline & Copyright -->
    <div class="tagline" style="text-align:center; margin-top:32px; color:rgba(255,255,255,0.8); font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg style="width:18px; height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
        </svg>
        Solusi untuk Jalan yang Lebih Baik!
    </div>
    <div class="copyright" style="text-align:center; margin-top:8px; color:rgba(255,255,255,0.5); font-size:12px;">© 2026 SIPKJ • Sistem Pengaduan Kerusakan Jalan</div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
        // Toggle Password Visibility untuk Login
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const iconSvg = btn.querySelector('.eye-icon');
            
            if (!input || !iconSvg) return;

            if (input.type === 'password') {
                input.type = 'text';
                // Ganti icon jadi mata dicoret
                iconSvg.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
                btn.setAttribute('title', 'Sembunyikan kata sandi');
            } else {
                input.type = 'password';
                // Ganti icon jadi mata normal
                iconSvg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
                btn.setAttribute('title', 'Lihat kata sandi');
            }
        }
    </script>
</body>
</html>
