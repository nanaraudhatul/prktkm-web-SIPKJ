<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pengaduan - SIPKJ</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/detail-pengaduan.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header" onclick="window.location.href='dashboard.html'" style="cursor:pointer;">
                <div class="sidebar-logo-container">
                    <div class="sidebar-logo-box">
                        <img src="../../images/logo-sipkj.png" alt="SIPKJ Logo"
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;background:#1e3a5f;color:white;font-weight:800;font-size:14px;width:100%;height:100%;border-radius:8px;\'>SIPKJ</div>';">
                    </div>
                    <div class="sidebar-brand">
                        <h2>SIPKJ</h2>
                        <p>Pengaduan Kerusakan Jalan</p>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Dashboard
                </a>
                <a href="buat-pengaduan.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    Buat Pengaduan
                </a>
                <a href="pengaduan-saya.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    Pengaduan Saya
                </a>
                <a href="profil.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Profil
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="handleLogout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <div class="topbar-title">
                        <h1>Detail Pengaduan</h1>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="user-profile">
                        <div class="user-avatar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="user-info">
                            <div class="user-name" id="userName">Loading...</div>
                            <div class="user-role">Masyarakat</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <!-- Back Button -->
                <button class="btn-back" onclick="window.history.back()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Kembali
                </button>

                <div class="detail-layout">
                    <!-- Main Content -->
                    <div class="detail-main">
                        <div class="detail-card">
                            <!-- Header Info -->
                            <div class="detail-header">
                                <div class="detail-header-left">
                                    <span class="status-badge" id="statusBadge">Diajukan</span>
                                    <span class="pelapor-info">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                            <circle cx="12" cy="7" r="4"/>
                                        </svg>
                                        Pelapor: <strong id="pelaporName">-</strong>
                                    </span>
                                </div>
                                <div class="detail-date" id="detailDate">-</div>
                            </div>

                            <!-- Judul -->
                            <h1 class="detail-title" id="detailJudul">-</h1>

                            <!-- Kategori -->
                            <span class="kategori-badge" id="detailKategori">-</span>

                            <div class="detail-divider"></div>

                            <!-- Deskripsi -->
                            <div class="detail-section">
                                <h3 class="section-title">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="8" y1="6" x2="21" y2="6"/>
                                        <line x1="8" y1="12" x2="21" y2="12"/>
                                        <line x1="8" y1="18" x2="21" y2="18"/>
                                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                                    </svg>
                                    Deskripsi
                                </h3>
                                <p class="section-content" id="detailDeskripsi">-</p>
                            </div>

                            <!-- Lokasi -->
                            <div class="detail-section">
                                <h3 class="section-title">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                                        <circle cx="12" cy="10" r="3"/>
                                    </svg>
                                    Lokasi
                                </h3>
                                <div class="lokasi-content">
                                    <div class="lokasi-info">
                                        <span class="lokasi-dot"></span>
                                        <span id="detailLokasi">-</span>
                                    </div>
                                    <a href="#" id="mapsLink" target="_blank" class="maps-link">
                                        Buka di Google Maps
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                                            <polyline points="15 3 21 3 21 9"/>
                                            <line x1="10" y1="14" x2="21" y2="3"/>
                                        </svg>
                                    </a>
                                </div>
                            </div>

                            <!-- Foto -->
                            <div class="detail-section" id="fotoSection">
                                <h3 class="section-title">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                    Foto
                                </h3>
                                <div class="foto-grid" id="fotoGrid">
                                    <!-- Diisi oleh JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar: Status Tracking -->
                    <div class="detail-sidebar">
                        <div class="status-card">
                            <h3 class="status-card-title">Status Pengaduan</h3>
                            <div class="status-timeline" id="statusTimeline">
                                <!-- Diisi oleh JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="page-footer">
                © 2026 SIPKJ. Sistem Pengaduan Kerusakan Jalan. Hak Cipta Dilindungi.
            </footer>
        </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/detail-pengaduan.js"></script>
</body>
</html>
