<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Kata Sandi - SIPKJ</title>
    <link rel="stylesheet" href="../../css/reset-password.css">
    <link rel="stylesheet" href="../../css/set-new-password.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <!-- Logo -->
            <div class="reset-logo">
                <div class="logo-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2.5">
                        <path d="M3 21L12 3L21 21"/>
                        <path d="M9 21L12 15L15 21"/>
                        <path d="M6 15H18"/>
                    </svg>
                </div>
                <h1>SIPKJ</h1>
                <p>Sistem Pengaduan Kerusakan Jalan</p>
            </div>

            <div class="reset-divider"></div>

            <!-- Title -->
            <h2 class="reset-title">Atur Ulang Kata Sandi</h2>
            <p class="reset-subtitle">Silakan masukkan kata sandi baru untuk akun Anda.</p>

            <!-- Form Password Baru -->
            <form id="setPasswordForm">
                <!-- Kata Sandi Baru -->
                <div class="form-group">
                    <label class="form-label">Kata Sandi Baru</label>
                    <div class="input-with-icon password-input">
                        <svg class="input-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                        <input type="password" id="newPassword" class="form-input" placeholder="Minimal 8 karakter" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Password Strength Indicator -->
                    <div class="strength-container">
                        <div class="strength-bar">
                            <div class="strength-segment" id="seg1"></div>
                            <div class="strength-segment" id="seg2"></div>
                            <div class="strength-segment" id="seg3"></div>
                            <div class="strength-segment" id="seg4"></div>
                        </div>
                        <div class="strength-label">
                            <span>Kekuatan Sandi:</span>
                            <span class="strength-text" id="strengthText">Belum Diisi</span>
                        </div>
                    </div>
                </div>

                <!-- Konfirmasi Kata Sandi -->
                <div class="form-group">
                    <label class="form-label">Konfirmasi Kata Sandi Baru</label>
                    <div class="input-with-icon password-input">
                        <svg class="input-icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 11-6.219-8.56"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Ulangi kata sandi baru" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="match-hint" id="matchHint"></div>
                </div>

                <!-- Message Box -->
                <div id="messageBox" class="message-box" style="display:none;"></div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit-password" id="btnSavePassword">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0110 0v4"/>
                    </svg>
                    SIMPAN KATA SANDI BARU
                </button>
            </form>

            <!-- Back to Login -->
            <div class="back-to-login">
                Ingat kata sandi Anda? <a href="login.html">Masuk ke sistem</a>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </div>
        </div>

        <!-- Footer -->
        <div class="reset-footer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="M9 12l2 2 4-4"/>
            </svg>
            Solusi untuk Jalan yang Lebih Baik!
        </div>
        <div class="reset-copyright">© 2026 SIPKJ. Sistem Pengaduan Kerusakan Jalan. Hak Cipta Dilindungi.</div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/set-new-password.js"></script>
</body>
</html>
