<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - SIPKJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/auth.css">
    <style>
        /* Toggle Password untuk Register */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #94a3b8;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .toggle-password:hover {
            color: #1e3a5f;
        }
        
        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
        
        .input-wrapper input {
            padding-right: 48px !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <!-- Logo SIPKJ PNG -->
        <div class="auth-logo">
            <div class="logo-wrapper">
                <img src="../../images/logo-sipkj.png" alt="SIPKJ Logo" class="logo-img">
            </div>
            <h1>Daftar Akun Baru</h1>
            <p>Sistem Pengaduan Kerusakan Jalan — Laporkan<br>kerusakan jalan dengan cepat dan terpantau</p>
        </div>

        <div class="auth-divider"></div>

        <!-- Error/Success Messages -->
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Form -->
        <form id="registerForm">
            <div class="form-group">
                <label>EMAIL <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </span>
                    <input type="email" id="regEmail" placeholder="contoh@gmail.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>USERNAME <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94"/>
                            </svg>
                        </span>
                        <input type="text" id="regUsername" placeholder="Masukkan username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>NO. TELEPON / WA <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                            </svg>
                        </span>
                        <input type="tel" id="regTelepon" placeholder="08xxxxxxxxxx" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>KATA SANDI <span class="required">*</span></label>
                <div class="input-wrapper" style="position:relative;">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="regPassword" placeholder="Minimal 8 karakter" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)" title="Lihat kata sandi">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>KONFIRMASI KATA SANDI <span class="required">*</span></label>
                <div class="input-wrapper" style="position:relative;">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </span>
                    <input type="password" id="regPasswordConfirm" placeholder="Ulangi kata sandi" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('regPasswordConfirm', this)" title="Lihat kata sandi">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Tipe Akun Statis -->
            <div class="form-group">
                <label>TIPE AKUN</label>
                <div style="background: #f0f4ff; border: 1.5px solid #1e3a5f; border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e3a5f" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                        <path d="M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                    <div>
                        <div style="font-size: 15px; font-weight: 700; color: #1e3a5f;">Masyarakat</div>
                        <div style="font-size: 12px; color: #64748b;">Akun ini digunakan untuk melaporkan kerusakan jalan</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn">DAFTAR SEKARANG</button>
        </form>

        <div class="auth-footer-link">
            Sudah memiliki akun? <a href="login.html">Masuk ke sistem 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Tagline & Copyright -->
    <div class="tagline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
        </svg>
        Solusi untuk Jalan yang Lebih Baik!
    </div>
    <div class="copyright">© 2026 SIPKJ • Sistem Pengaduan Kerusakan Jalan</div>

    <!-- External JS -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
</body>
</html>
