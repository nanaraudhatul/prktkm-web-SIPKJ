<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - SIPKJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/auth.css">
    <style>
        /* Toggle Password untuk Register */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #94a3b8;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .toggle-password:hover {
            color: #1e3a5f;
        }
        
        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
        
        .input-wrapper input {
            padding-right: 48px !important;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <!-- Logo SIPKJ PNG -->
        <div class="auth-logo">
            <div class="logo-wrapper">
                <img src="../../images/logo-sipkj.png" alt="SIPKJ Logo" class="logo-img">
            </div>
            <h1>Daftar Akun Baru</h1>
            <p>Sistem Pengaduan Kerusakan Jalan — Laporkan<br>kerusakan jalan dengan cepat dan terpantau</p>
        </div>

        <div class="auth-divider"></div>

        <!-- Error/Success Messages -->
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Form -->
        <form id="registerForm">
            <div class="form-group">
                <label>EMAIL <span class="required">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </span>
                    <input type="email" id="regEmail" placeholder="contoh@gmail.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>USERNAME <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94"/>
                            </svg>
                        </span>
                        <input type="text" id="regUsername" placeholder="Masukkan username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>NO. TELEPON / WA <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                            </svg>
                        </span>
                        <input type="tel" id="regTelepon" placeholder="08xxxxxxxxxx" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>KATA SANDI <span class="required">*</span></label>
                <div class="input-wrapper" style="position:relative;">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="regPassword" placeholder="Minimal 8 karakter" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('regPassword', this)" title="Lihat kata sandi">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>KONFIRMASI KATA SANDI <span class="required">*</span></label>
                <div class="input-wrapper" style="position:relative;">
                    <span class="input-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </span>
                    <input type="password" id="regPasswordConfirm" placeholder="Ulangi kata sandi" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('regPasswordConfirm', this)" title="Lihat kata sandi">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>DAFTAR SEBAGAI / ROLE <span class="required">*</span></label>
                <div class="role-selector">
                    <div class="role-option active" onclick="selectRole(this)" data-role="masyarakat">
                        <div class="role-radio"></div>
                        Masyarakat
                    </div>
                    <div class="role-option" onclick="selectRole(this)" data-role="petugas">
                        <div class="role-radio"></div>
                        Petugas
                    </div>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">Saya menyetujui <a href="#">Syarat dan Ketentuan</a> pelaporan SIPKJ</label>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn">DAFTAR SEKARANG</button>
        </form>

        <div class="auth-footer-link">
            Sudah memiliki akun? <a href="login.html">Masuk ke sistem 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Tagline & Copyright -->
    <div class="tagline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
        </svg>
        Solusi untuk Jalan yang Lebih Baik!
    </div>
    <div class="copyright">© 2025 SIPKJ • Sistem Pengaduan Kerusakan Jalan</div>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        // Toggle Password Visibility untuk Register
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const iconSvg = btn.querySelector('.eye-icon');
            
            if (!input || !iconSvg) return;

            if (input.type === 'password') {
                input.type = 'text';
                // Ganti icon jadi mata dicoret
                iconSvg.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
                btn.setAttribute('title', 'Sembunyikan kata sandi');
            } else {
                input.type = 'password';
                // Ganti icon jadi mata normal
                iconSvg.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
                btn.setAttribute('title', 'Lihat kata sandi');
            }
        }

        // ===== REGISTER LOGIC =====
        let selectedRole = 'masyarakat';

        function selectRole(el) {
            document.querySelectorAll('.role-option').forEach(r => r.classList.remove('active'));
            el.classList.add('active');
            selectedRole = el.dataset.role;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            successDiv.classList.remove('show');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('registerBtn');
            const originalText = btn.textContent;
            btn.textContent = 'MEMPROSES...';
            btn.disabled = true;

            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regPasswordConfirm').value;

            if (password !== confirmPassword) {
                showError('Kata sandi konfirmasi tidak cocok!');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            if (password.length < 8) {
                showError('Kata sandi minimal 8 karakter!');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            if (!document.getElementById('agreeTerms').checked) {
                showError('Anda harus menyetujui Syarat dan Ketentuan!');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            const formData = {
                email: document.getElementById('regEmail').value.trim(),
                username: document.getElementById('regUsername').value.trim(),
                telepon: document.getElementById('regTelepon').value.trim(),
                password: password,
                role: selectedRole
            };

            console.log('Mengirim data ke backend...');
            console.log('Data:', formData);

            try {
                const response = await fetch('http://localhost/sipkj/backend/api/auth/register.php', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const contentType = response.headers.get('content-type');
                console.log('Response status:', response.status);
                console.log('Content-Type:', contentType);

                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    console.error('Server response (bukan JSON):', text);
                    throw new Error('Server mengembalikan HTML error. Cek console untuk detail.');
                }

                console.log('Response data:', data);

                if (!response.ok) {
                    throw new Error(data.message || 'Pendaftaran gagal');
                }

                showSuccess(data.message || 'Pendaftaran berhasil! Mengalihkan ke halaman login...');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                
            } catch (error) {
                console.error('Register error:', error);
                showError(error.message || 'Tidak dapat terhubung ke server');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
